[project]
name = "vlmproject"
version = "0.1.0"
description = "Small VLM evaluation harness for VLMBias-style benchmarks."
readme = "README.md"
# PyTorch 2.7.x does not publish CPython 3.14 wheels. Keep the project from
# silently selecting Neuronic's current system Python 3.14.
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets>=2.19.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
qwen = [
    "accelerate>=0.30.0",
    "qwen-vl-utils>=0.0.8",
    # Keep Linux wheels on CUDA 12.x. Newer unconstrained PyTorch releases
    # currently resolve to CUDA 13, which is not portable across Neuronic's
    # heterogeneous driver/GPU fleet.
    "torch>=2.4.0,<2.8.0",
    "torchvision>=0.19.0,<0.23.0",
    "transformers>=4.57.0",
]
paligemma = [
    "accelerate>=0.30.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers>=4.51.0",
]
dev = [
    "pytest>=8.0.0",
]
judge = [
    "anthropic>=0.57.0",
]
mechanistic = [
    "peft>=0.13.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[project.scripts]
vlm-eval = "vlm_eval.cli:main"
vlm-eval-naturalbench = "vlm_eval.naturalbench_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlm_eval", "adapters"]
